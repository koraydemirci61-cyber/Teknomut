[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "depkont"
version = "0.1.0"
description = "Depo kontrol uygulaması"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[project.scripts]
depkont = "depkont.cli:main"

[tool.setuptools.packages.find]
include = ["depkont*"]
