[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sevkab"
version = "0.1.0"
description = "SevKab uygulaması"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
sevkab = "sevkab.cli:main"

[tool.setuptools.packages.find]
include = ["sevkab*"]
